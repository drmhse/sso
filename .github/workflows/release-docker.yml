name: Release Docker Images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.backend }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: sqlite
            binary_name: sso_sqlite
            tag_prefix: sqlite
          - backend: postgres
            binary_name: sso_psql
            tag_prefix: psql
          - backend: mysql
            binary_name: sso_mysql
            tag_prefix: mysql
    env:
      DOCKER_IMAGE: editoredit/sso
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install musl targets
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install workspace dependencies
        run: npm ci

      - name: Prepare Docker dist
        env:
          AUTHOS_BUILD_VERSION: ${{ github.ref_name }}
        run: npm run authos:docker:dist -- --backend ${{ matrix.backend }}

      - name: Compute Docker tags
        id: docker_tags
        env:
          VERSION_TAG: ${{ github.ref_name }}
          BACKEND: ${{ matrix.backend }}
          TAG_PREFIX: ${{ matrix.tag_prefix }}
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
        run: |
          set -euo pipefail
          version_without_v="${VERSION_TAG#v}"
          {
            echo 'tags<<EOF'
            if [ "${BACKEND}" = "sqlite" ]; then
              echo "${DOCKER_IMAGE}:${VERSION_TAG}"
              echo "${DOCKER_IMAGE}:${version_without_v}"
              echo "${DOCKER_IMAGE}:latest"
            fi
            echo "${DOCKER_IMAGE}:${TAG_PREFIX}-${VERSION_TAG}"
            echo "${DOCKER_IMAGE}:${TAG_PREFIX}-${version_without_v}"
            echo "${DOCKER_IMAGE}:${TAG_PREFIX}-latest"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            BINARY_NAME=${{ matrix.binary_name }}
          tags: ${{ steps.docker_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=AuthOS
            org.opencontainers.image.source=https://github.com/drmhse/AuthOS
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
