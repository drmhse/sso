name: Release Standalone Bundles

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            rust_target: x86_64-unknown-linux-musl
          - platform: linux/arm64
            arch: arm64
            rust_target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Install UPX and binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl binutils || sudo apt-get install -y upx binutils

      - name: Install workspace dependencies
        run: npm ci

      - name: Build standalone bundle
        run: npm run authos:binary -- --backend sqlite --platform ${{ matrix.platform }}

      - name: Generate checksum
        run: |
          cd .authos/releases
          sha256sum authos-sqlite-linux-${{ matrix.arch }}.tar.gz > authos-sqlite-linux-${{ matrix.arch }}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.arch }}
          path: |
            .authos/releases/authos-sqlite-linux-${{ matrix.arch }}.tar.gz
            .authos/releases/authos-sqlite-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error

  publish:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Consolidate checksums
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/authos-sqlite-linux-amd64.tar.gz
            dist/authos-sqlite-linux-arm64.tar.gz
            dist/SHA256SUMS.txt
