name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust format, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: api -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check migration crate formatting
        run: cargo fmt --manifest-path migration/Cargo.toml --all -- --check

      - name: Run Clippy
        run: >-
          cargo clippy --locked --package sso --all-targets --no-deps
          -- -D warnings

      - name: Run migration Clippy
        run: >-
          cargo clippy --manifest-path migration/Cargo.toml --locked
          --all-targets --no-deps -- -D warnings

      - name: Run SQLite tests
        run: cargo test --locked --package sso --all-targets

      - name: Run migration crate tests
        run: cargo test --manifest-path migration/Cargo.toml --locked --all-targets

  rust-backends:
    name: Rust compile (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: SQLite
            feature: db_sqlite
          - backend: PostgreSQL
            feature: db_psql
          - backend: MySQL
            feature: db_mysql
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: api -> target
          shared-key: backend-${{ matrix.feature }}

      - name: Check backend targets
        run: >-
          cargo check --locked --package sso --no-default-features
          --features ${{ matrix.feature }} --all-targets

  frontend:
    name: TypeScript checks, tests, and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Validate trust and release metadata
        run: npm run check:trust

      - name: Validate installer shell
        run: bash -n install.sh

      # Several workspaces resolve @drmhse/sso-sdk through its package exports,
      # whose type entry points live in the ignored dist directory.
      - name: Build SDK dependency
        run: npm run build:sdk

      - name: Lint workspaces
        run: npm run lint

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Test workspaces
        run: npm run test --workspaces --if-present

      - name: Build workspaces
        run: npm run build
