[package]
name = "authos-core"
version = "0.1.40"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower_governor = "0.3"
forwarded-header-value = "0.1"
rsa = { version = "0.9", features = ["sha2"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "macros", "chrono", "migrate", "sqlite", "postgres", "mysql"] }
sea-orm = { version = "1.1", default-features = false, features = ["macros", "runtime-tokio-rustls", "with-chrono", "with-json", "sqlx-sqlite", "sqlx-postgres", "sqlx-mysql"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
oauth2 = { version = "5.0", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.103"
thiserror = "1.0"
tracing = "0.1"
sha2 = "0.10"
rand = "0.8.6"
base64 = "0.22"
subtle = "2.5"
http = "1.0"
