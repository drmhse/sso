[package]
name = "authos-crypto"
version = "0.1.40"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
oauth2 = { version = "5.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.103"
thiserror = "1.0"
tracing = "0.1"
time = { version = "0.3", features = ["serde", "formatting"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8.6"
num_cpus = "1.16"
aes-gcm = "0.10"
base64 = "0.22"
argon2 = "0.5"
totp-rs = { version = "5.5", features = ["gen_secret", "qr"] }
qrcode = "0.14"
url = "2.5"
authos-core = { path = "../authos-core", default-features = false }

[features]
# Test-only shortcuts. Reachable only through dev-dependencies.
test-support = []
