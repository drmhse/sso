# Development docker-compose - runs supporting services only
# Run the API natively with: cargo run (using .env.dev)
services:
  # Test database
  db-test:
    # CI/runtime qualification candidate; this is not a stable support-window promise.
    image: postgres:16-alpine
    container_name: sso-db-test
    environment:
      POSTGRES_DB: sso_test
      POSTGRES_USER: sso_test_user
      POSTGRES_PASSWORD: sso_test_password
    # Increase max connections and shared memory for parallel testing
    command: postgres -c max_connections=500
    shm_size: 256mb
    ports:
      - "5433:5432"
    volumes:
      - pg_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso_test_user -d sso_test"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sso-dev-network

  # MySQL Test Database
  db-mysql-test:
    # CI/runtime qualification candidate; this is not a stable support-window promise.
    image: mysql:8.4
    container_name: sso-db-mysql-test
    environment:
      MYSQL_DATABASE: sso_test
      MYSQL_USER: sso_test_user
      MYSQL_PASSWORD: sso_test_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sso-dev-network

  # Mock external services server
  mock-server:
    build:
      context: ../test-integration/mock-server
      dockerfile: Dockerfile
    container_name: sso-mock-server
    ports:
      - "9000:9000"
    environment:
      NODE_ENV: test
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:9000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sso-dev-network

  # Mailpit for testing emails
  mailpit:
    image: axllent/mailpit:latest
    container_name: sso-mailpit
    command: ["--smtp-max-recipients=500", "--max=10000"]
    environment:
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web interface
    networks:
      - sso-dev-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8025/",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  # Keycloak for Enterprise SSO testing (OIDC/SAML)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: sso-keycloak
    command: start-dev --import-realm --health-enabled=true
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ../test-integration/fixtures/keycloak-realm.json:/opt/keycloak/data/import/realm.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sso-dev-network

volumes:
  pg_test_data:
    driver: local

networks:
  sso-dev-network:
    driver: bridge
