[workspace]
members = ["crates/*", "migration"]

[package]
name = "sso"
version = "0.1.40"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "set-header", "limit"] }
tower_governor = "0.3"
include_dir = "0.7"
mime_guess = "2.0"

# Database - STRICTLY Rustls
# Pure Rust RSA and X.509. Replaces the vendored OpenSSL that used to be here:
# its static archives embed their own build path, which makes them impossible to
# relocate and forces a full C rebuild on every fresh checkout.
rsa = { version = "0.9", features = ["sha2"] }
x509-cert = "0.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "macros", "chrono", "migrate", "sqlite", "postgres", "mysql"] }
sea-orm = { version = "1.1", default-features = false, features = ["macros", "runtime-tokio-rustls", "with-chrono", "with-json", "sqlx-sqlite", "sqlx-postgres", "sqlx-mysql"] }
migration = { path = "migration", default-features = false }

# Layer crates (see COMPRESSION.md for the enforced layer order)
authos-core = { path = "crates/authos-core", default-features = false }
authos-entities = { path = "crates/authos-entities", default-features = false }
authos-crypto = { path = "crates/authos-crypto", default-features = false }
authos-db = { path = "crates/authos-db", default-features = false }
authos-audit = { path = "crates/authos-audit", default-features = false }
authos-store = { path = "crates/authos-store", default-features = false }
authos-services = { path = "crates/authos-services", default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# JWT

# OAuth2 - Rustls only
oauth2 = { version = "5.0", default-features = false }
# Reqwest - Rustls only, NO native-tls
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.103"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
time = { version = "0.3", features = ["serde", "formatting"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8.6"

# Encryption
base64 = "0.22"
subtle = "2.5"

# HTTP types
http = "1.0"

# Password hashing
argon2 = "0.5"

# Email - Rustls only

# TOTP/MFA

# WebAuthn - DISABLE defaults to avoid OpenSSL
# 0.6 replaced OpenSSL with RustCrypto, which is what removes the last C
# dependency from this tree. It is a prerelease, which is the cost of that.
webauthn-rs = { version = "0.6.1-dev", default-features = false, features = ["danger-allow-state-serialisation"] }

# DNS

# Regex
regex = "1.10"

# URL parsing
url = "2.5"

# GeoIP

# Audit

# Caching
moka = { version = "0.12", features = ["future"] }

# S3 - Lightweight Replacement (Custom Util, no crate)
# rusty-s3 removed

# Observability
metrics = "0.21"
metrics-exporter-prometheus = { version = "0.12", default-features = false }

# SAML
# samael removed
quick-xml = "0.41"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
# x509-parser version managed by rcgen/webauthn-rs
flate2 = "1.0"

[[bin]]
name = "sso_sqlite"
path = "src/sso_sqlite.rs"
required-features = ["db_sqlite"]

[[bin]]
name = "sso_psql"
path = "src/sso_psql.rs"
required-features = ["db_psql"]

[[bin]]
name = "sso_mysql"
path = "src/sso_mysql.rs"
required-features = ["db_mysql"]

[features]
default = ["db_sqlite"]
db_sqlite = ["sea-orm/sqlx-sqlite", "sqlx/sqlite", "migration/db_sqlite", "authos-db/db_sqlite", "authos-store/db_sqlite", "authos-services/db_sqlite", "authos-testkit/db_sqlite"]
db_psql = ["sea-orm/sqlx-postgres", "sqlx/postgres", "migration/db_psql", "authos-db/db_psql", "authos-store/db_psql", "authos-services/db_psql", "authos-testkit/db_psql"]
db_mysql = ["sea-orm/sqlx-mysql", "sqlx/mysql", "migration/db_mysql", "authos-db/db_mysql", "authos-store/db_mysql", "authos-services/db_mysql", "authos-testkit/db_mysql"]

[dev-dependencies]
authos-testkit = { path = "crates/authos-testkit", default-features = false }
authos-crypto = { path = "crates/authos-crypto", features = ["test-support"], default-features = false }
authos-audit = { path = "crates/authos-audit", features = ["test-support"], default-features = false }
authos-services = { path = "crates/authos-services", features = ["test-support"], default-features = false }

[patch.crates-io]
sqlx-mysql = { path = "vendor/sqlx-mysql" }

# =============================================================================
# Release Profile - Optimized for SIZE ("z")
# =============================================================================
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
