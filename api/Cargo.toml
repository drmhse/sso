[package]
name = "sso"
version = "0.1.39"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "set-header"] }
tower_governor = "0.3"

# Database - STRICTLY Rustls
# WebAuthn forces OpenSSL, so we vendor it for static linking
openssl = { version = "0.10", features = ["vendored"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "macros", "chrono", "migrate", "sqlite", "postgres", "mysql"] }
sea-orm = { version = "1.1", default-features = false, features = ["macros", "runtime-tokio-rustls", "with-chrono", "with-json", "sqlx-sqlite", "sqlx-postgres", "sqlx-mysql"] }
migration = { path = "migration" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# JWT
jsonwebtoken = "9"

# OAuth2 - Rustls only
oauth2 = { version = "4.4", default-features = false, features = ["reqwest", "rustls-tls"] }
# Reqwest - Rustls only, NO native-tls
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "rustls-tls-webpki-roots"] }

# Stripe - Rustls only
async-stripe = { version = "0.36", default-features = false, features = ["billing", "checkout", "connect", "runtime-tokio-hyper-rustls-webpki", "webhook-events"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
time = { version = "0.3", features = ["serde", "formatting"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
hmac = "0.12"
futures = "0.3"
async-trait = "0.1"
num_cpus = "1.16"

# Encryption
aes-gcm = "0.10"
base64 = "0.22"
subtle = "2.5"

# RSA
rsa = { version = "0.9", features = ["sha2", "pem"] }

# HTTP types
http = "1.0"

# Password hashing
argon2 = "0.5"

# Email - Rustls only
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }

# TOTP/MFA
totp-rs = { version = "5.5", features = ["gen_secret", "qr"] }
qrcode = "0.14"

# WebAuthn - DISABLE defaults to avoid OpenSSL
webauthn-rs = { version = "0.5", default-features = false, features = ["danger-allow-state-serialisation"] }

# DNS
hickory-resolver = "0.24"

# Regex
regex = "1.10"

# URL parsing
url = "2.5"

# GeoIP
maxminddb = "0.27"
geoutils = "0.5"

# Audit
strum = { version = "0.25", features = ["derive"] }

# Caching
moka = { version = "0.12", features = ["future"] }

# S3 - Lightweight Replacement (Custom Util, no crate)
# rusty-s3 removed

# Observability
metrics = "0.21"
metrics-exporter-prometheus = "0.12"
axum-prometheus = "0.4"

# SAML
# samael removed
quick-xml = "0.31"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
# x509-parser version managed by rcgen/webauthn-rs
flate2 = "1.0"
pkcs1 = "0.7.5"
pkcs8 = "0.10"
tar = "0.4"

[[bin]]
name = "sso_sqlite"
path = "src/sso_sqlite.rs"
required-features = ["db_sqlite"]

[[bin]]
name = "sso_psql"
path = "src/sso_psql.rs"
required-features = ["db_psql"]

[[bin]]
name = "sso_mysql"
path = "src/sso_mysql.rs"
required-features = ["db_mysql"]

[features]
default = ["db_sqlite"]
db_sqlite = ["sea-orm/sqlx-sqlite", "sqlx/sqlite"]
db_psql = ["sea-orm/sqlx-postgres", "sqlx/postgres"]
db_mysql = ["sea-orm/sqlx-mysql", "sqlx/mysql"]

# =============================================================================
# Release Profile - Optimized for SIZE ("z")
# =============================================================================
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
