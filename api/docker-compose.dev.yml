# Development docker-compose - runs supporting services only
# Run the API natively with: cargo run (using .env.dev)
services:
  # Test database
  db-test:
    image: postgres:15-alpine
    container_name: sso-db-test
    environment:
      POSTGRES_DB: sso_test
      POSTGRES_USER: sso_test_user
      POSTGRES_PASSWORD: sso_test_password
    # Increase max connections and shared memory for parallel testing
    command: postgres -c max_connections=500
    shm_size: 256mb
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso_test_user -d sso_test"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sso-dev-network

  # Mailpit for testing emails
  mailpit:
    image: axllent/mailpit:latest
    container_name: sso-mailpit
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web interface
    networks:
      - sso-dev-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8025/",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_dev_data:
    driver: local

networks:
  sso-dev-network:
    driver: bridge
